[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow313"
version = "2.0.0"
description = "Local-First AI-Powered Security Intelligence CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "mohamad", email = "mohamad@shadow313.dev"}
]
keywords = ["security", "cli", "ai", "ollama", "recon", "vulnerability", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities",
]

dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
ai = [
    "chromadb>=0.4.0",
    "scikit-learn>=1.3.0",
]
web = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "htmx>=0.0.1",
]
reports = [
    "jinja2>=3.1.0",
    "weasyprint>=60.0",
]
graph = [
    "networkx>=3.2",
]
all = [
    "shadow313[ai,web,reports,graph]",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "flake8>=6.0.0",
]

[project.scripts]
shadow313 = "shadow313.cli:main"

[project.urls]
Homepage = "https://github.com/alexhuhter313-debug/shadow313"
Documentation = "https://github.com/alexhuhter313-debug/shadow313/tree/main/docs"
Repository = "https://github.com/alexhuhter313-debug/shadow313"
Issues = "https://github.com/alexhuhter313-debug/shadow313/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
